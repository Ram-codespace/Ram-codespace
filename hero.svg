<rect width="1000" height="340" rx="22" fill="#0d0e16"/><rect width="1000" height="340" rx="22" fill="url(#d)"/>
<rect x="1" y="1" width="998" height="338" rx="21" fill="none" stroke="url(#g)" stroke-opacity=".5"/>
<rect x="48" y="40" width="190" height="28" rx="14" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/>
