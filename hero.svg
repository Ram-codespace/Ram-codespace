<style>text{font-family:'JetBrains Mono',Menlo,Consolas,monospace}.h{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:800}
@keyframes pulse{50%{opacity:.25}}.p{animation:pulse 1.6s infinite}
@keyframes blink{50%{opacity:0}}.c{animation:blink 1s steps(1) infinite}
@keyframes r1{0%,30%{opacity:1}33%,97%{opacity:0}100%{opacity:1}}
@keyframes r2{0%,30%{opacity:0}33%,63%{opacity:1}66%,100%{opacity:0}}
@keyframes r3{0%,63%{opacity:0}66%,97%{opacity:1}100%{opacity:0}}
