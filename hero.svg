<g font-size="19" fill="#e8eaf6"><text class="a" x="48" y="232">&gt; Java Full Stack Developer</text><text class="b" x="48" y="232">&gt; Spring Boot + React.js</text><text class="e" x="48" y="232">&gt; REST APIs &amp; MySQL</text></g>
<rect class="c" x="400" y="216" width="10" height="20" fill="#f472b6"/>
<text x="48" y="276" font-size="13" fill="#8b8fa8">B.Sc. Computer Science · Chennai, Tamil Nadu, India</text>
<text x="48" y="300" font-size="13" fill="#8b8fa8">I build end-to-end web apps: secure APIs, relational data, clean UIs.</text>
